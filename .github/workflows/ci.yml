name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          LLM_PROVIDER: mock
        run: python -m pytest -q

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag orvilo:ci .
      - name: Start container
        run: docker run --detach --rm --name orvilo-ci --publish 5000:5000 orvilo:ci
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/market/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs orvilo-ci
          exit 1
      - name: Verify dashboard
        run: curl --fail --silent http://127.0.0.1:5000/ >/dev/null
      - name: Stop container
        if: always()
        run: docker stop orvilo-ci || true
